# Netlify — telasdemama.com (web nueva en Astro)

[build]
  command = "npm run build"
  publish = "dist"

# Funciones sin servidor: netlify/functions/pago.mjs crea la sesión de pago con tarjeta (Stripe Checkout).
# Necesita la variable de entorno STRIPE_SECRET_KEY en Netlify (Site configuration → Environment variables).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  # Astro 7 necesita Node 22.12 o superior
  NODE_VERSION = "22"

# G3 del método: la web de pruebas NO se indexa.
# Se QUITA el día del cambio de DNS (Fase 7, paso 8), ni antes ni después.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
